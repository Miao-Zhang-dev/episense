<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>传感器管理 - 登录</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef2f3;color:#17252b;font:16px system-ui,"Microsoft YaHei",sans-serif}
    main{width:min(420px,calc(100% - 32px));background:#fff;border:1px solid #d4dfe1;border-radius:8px;padding:28px}
    h1{font-size:24px;margin:0 0 6px}p{color:#65777d;margin:0 0 22px}.modes{display:flex;border-bottom:1px solid #dce4e5;margin-bottom:20px}
    button,input{font:inherit}button{cursor:pointer}.mode{background:none;border:0;border-bottom:2px solid transparent;padding:10px 14px;color:#62757b}.mode.active{color:#087f72;border-color:#087f72}
    label{display:block;font-size:14px;margin:14px 0 6px}input{width:100%;padding:10px 11px;border:1px solid #cbd7d9;border-radius:4px}
    .submit{width:100%;margin-top:20px;padding:11px;border:0;border-radius:4px;background:#087f72;color:white}.message{min-height:22px;margin-top:12px;color:#aa3c32;font-size:14px}
  </style>
</head>
<body>
  <main>
    <h1>传感器管理平台</h1>
    <p>登录或创建账号以管理传感器数据</p>
    <div class="modes" role="tablist">
      <button class="mode active" type="button" data-mode="login">登录</button>
      <button class="mode" type="button" data-mode="register">注册</button>
    </div>
    <form id="auth-form">
      <label for="username">用户名</label><input id="username" name="username" maxlength="64" autocomplete="username" required>
      <label for="password">密码</label><input id="password" name="password" type="password" minlength="6" maxlength="128" autocomplete="current-password" required>
      <button class="submit" type="submit">登录</button>
    </form>
    <div class="message" id="message" role="status"></div>
  </main>
  <script>
    let mode='login';
    document.querySelectorAll('.mode').forEach(button=>button.addEventListener('click',()=>{
      mode=button.dataset.mode;
      document.querySelectorAll('.mode').forEach(item=>item.classList.toggle('active',item===button));
      document.querySelector('.submit').textContent=mode==='login'?'登录':'注册';
      document.querySelector('#password').autocomplete=mode==='login'?'current-password':'new-password';
      document.querySelector('#message').textContent='';
    }));
    document.querySelector('#auth-form').addEventListener('submit',async event=>{
      event.preventDefault();
      const message=document.querySelector('#message');
      try {
        const response=await fetch('/api/auth/'+mode,{method:'POST',headers:{'Content-Type':'application/x-www-form-urlencoded'},body:new URLSearchParams(new FormData(event.currentTarget))});
        const result=await response.json();
        if(!response.ok) throw new Error(result.error||'请求失败');
        location.href='/2.html';
      } catch(error) { message.textContent=error.message; }
    });
  </script>
</body>
</html>
